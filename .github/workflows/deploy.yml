name: Deploy Worker

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: .
      - name: Verify IndexNow & GA secrets
        run: |
          if [ -z "${INDEXNOW_KEY}" ]; then
            echo "::warning::INDEXNOW_KEY is not set — IndexNow pings are skipped at build."
          fi
          if [ -z "${PUBLIC_GA_MEASUREMENT_ID}" ]; then
            echo "::warning::PUBLIC_GA_MEASUREMENT_ID is not set — GA4 will not load on the live site."
          fi
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.PUBLIC_GA_MEASUREMENT_ID }}
      - name: Build static assets
        run: node scripts/cf-build.mjs
        env:
          SITE_ORIGIN: https://arcraiderhacks.com
          SITEMAP_ORIGIN: https://arcraiderhacks.com
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.PUBLIC_GA_MEASUREMENT_ID }}
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: SEO redirect & HTTPS smoke tests
        continue-on-error: true
        run: node scripts/seo-smoke.mjs
        env:
          SMOKE_ORIGIN: https://arcraiderhacks.com
