# Static Astro site on Workers Assets. Cloudflare Builds runs `npx wrangler deploy`.
# Worker name must match the CI script: arcraider-cheats--com.
name = "arcraider-cheats--com"
main = "src/worker.js"
compatibility_date = "2026-10-26"
workers_dev = true

# Custom domain routes — deploy fails if this zone is not on the same Cloudflare account.
# Comment out both [[routes]] blocks until arcraiderhacks.com is on the account, then redeploy.
[[routes]]
pattern = "arcraiderhacks.com/*"
zone_name = "arcraiderhacks.com"
[[routes]]
pattern = "www.arcraiderhacks.com/*"
zone_name = "arcraiderhacks.com"

# Do not set [build] here. Cloudflare Builds / CI already run `node scripts/cf-build.mjs` or
# `npm run build` first; a second build during `wrangler deploy` duplicates work and can fail.

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
