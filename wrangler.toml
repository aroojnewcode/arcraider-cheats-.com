# Static Astro site on Workers Assets. Cloudflare Builds runs `npx wrangler deploy`.
# Worker name must match the CI script: arcraider-cheats--com.
name = "arcraider-cheats--com"
main = "src/worker.js"
compatibility_date = "2026-10-26"
workers_dev = true

# Custom domain (uncomment when arcraiderhacks.com is on this Cloudflare account):
# [[routes]]
# pattern = "arcraiderhacks.com/*"
# zone_name = "arcraiderhacks.com"
# [[routes]]
# pattern = "www.arcraiderhacks.com/*"
# zone_name = "arcraiderhacks.com"

[build]
command = "node scripts/cf-build.mjs"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
